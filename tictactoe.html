<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #05050f;
            color: white;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* === SPOTLIGHT EFFECTS === */
        .spotlight-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -4;
            pointer-events: none;
        }

        .spotlight {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0;
            animation: spotlight-move 12s infinite ease-in-out;
        }

        .spotlight.cyan {
            width: 500px;
            height: 500px;
            background: radial-gradient(ellipse, rgba(0, 212, 255, 0.12) 0%, rgba(0, 212, 255, 0.05) 40%, transparent 70%);
            top: -10%;
            left: -5%;
            animation-delay: 0s;
            animation-duration: 14s;
        }

        .spotlight.magenta {
            width: 450px;
            height: 450px;
            background: radial-gradient(ellipse, rgba(255, 107, 107, 0.12) 0%, rgba(255, 107, 107, 0.05) 40%, transparent 70%);
            bottom: -10%;
            right: -5%;
            animation-delay: -4s;
            animation-duration: 16s;
        }

        .spotlight.purple {
            width: 400px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(128, 0, 128, 0.1) 0%, rgba(128, 0, 128, 0.04) 40%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -8s;
            animation-duration: 18s;
        }

        .spotlight.small-cyan {
            width: 250px;
            height: 250px;
            background: radial-gradient(ellipse, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            top: 60%;
            left: 15%;
            animation-delay: -6s;
            animation-duration: 11s;
        }

        .spotlight.small-magenta {
            width: 200px;
            height: 200px;
            background: radial-gradient(ellipse, rgba(255, 107, 107, 0.1) 0%, transparent 70%);
            top: 15%;
            right: 20%;
            animation-delay: -10s;
            animation-duration: 13s;
        }

        @keyframes spotlight-move {
            0%, 100% {
                opacity: 0.3;
                transform: translate(0, 0) scale(1);
            }
            25% {
                opacity: 0.6;
                transform: translate(30px, 20px) scale(1.1);
            }
            50% {
                opacity: 0.8;
                transform: translate(0, 40px) scale(1.2);
            }
            75% {
                opacity: 0.5;
                transform: translate(-20px, 20px) scale(1.05);
            }
        }

        /* === FROSTED GLASS BACKGROUND === */
        .frosted-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            overflow: hidden;
            pointer-events: none;
        }

        .frosted-panel {
            position: absolute;
            border-radius: 30px;
            background: rgba(10, 10, 40, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .frosted-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.08) 0%,
                transparent 50%,
                rgba(255, 255, 255, 0.02) 100%
            );
            pointer-events: none;
        }

        .frosted-panel::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent,
                rgba(0, 212, 255, 0.03),
                transparent,
                rgba(255, 107, 107, 0.03),
                transparent
            );
            animation: panel-rotate 30s linear infinite;
            pointer-events: none;
        }

        .panel-1 {
            width: 400px;
            height: 500px;
            top: -5%;
            left: -8%;
            transform: rotate(-8deg);
            animation: float-panel-1 20s infinite ease-in-out;
        }

        .panel-2 {
            width: 350px;
            height: 350px;
            bottom: -5%;
            right: -5%;
            transform: rotate(12deg);
            animation: float-panel-2 25s infinite ease-in-out;
        }

        .panel-3 {
            width: 300px;
            height: 400px;
            top: 20%;
            right: -3%;
            transform: rotate(5deg);
            animation: float-panel-3 22s infinite ease-in-out;
        }

        .panel-4 {
            width: 280px;
            height: 300px;
            bottom: 25%;
            left: -3%;
            transform: rotate(-10deg);
            animation: float-panel-4 18s infinite ease-in-out;
        }

        .panel-5 {
            width: 200px;
            height: 200px;
            top: 10%;
            left: 40%;
            border-radius: 50%;
            transform: rotate(0deg);
            animation: float-panel-5 16s infinite ease-in-out;
        }

        @keyframes panel-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float-panel-1 {
            0%, 100% { transform: rotate(-8deg) translate(0, 0); }
            33% { transform: rotate(-5deg) translate(15px, -20px); }
            66% { transform: rotate(-11deg) translate(-10px, 15px); }
        }

        @keyframes float-panel-2 {
            0%, 100% { transform: rotate(12deg) translate(0, 0); }
            33% { transform: rotate(9deg) translate(-15px, 20px); }
            66% { transform: rotate(15deg) translate(10px, -10px); }
        }

        @keyframes float-panel-3 {
            0%, 100% { transform: rotate(5deg) translate(0, 0); }
            33% { transform: rotate(8deg) translate(-20px, 10px); }
            66% { transform: rotate(2deg) translate(10px, -15px); }
        }

        @keyframes float-panel-4 {
            0%, 100% { transform: rotate(-10deg) translate(0, 0); }
            33% { transform: rotate(-7deg) translate(20px, -15px); }
            66% { transform: rotate(-13deg) translate(-15px, 20px); }
        }

        @keyframes float-panel-5 {
            0%, 100% { transform: scale(1); }
            33% { transform: scale(1.1) translate(10px, 10px); }
            66% { transform: scale(0.95) translate(-10px, -10px); }
        }

        /* === GRID OVERLAY === */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px);
            background-size: 80px 80px;
            animation: grid-drift 60s linear infinite;
        }

        @keyframes grid-drift {
            from { background-position: 0 0; }
            to { background-position: 80px 80px; }
        }

        /* === FLOATING PARTICLES === */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: particle-float linear infinite;
        }

        .particle.cyan {
            background: rgba(0, 212, 255, 0.6);
            box-shadow: 0 0 6px rgba(0, 212, 255, 0.4);
        }

        .particle.magenta {
            background: rgba(255, 107, 107, 0.6);
            box-shadow: 0 0 6px rgba(255, 107, 107, 0.4);
        }

        .particle.purple {
            background: rgba(128, 0, 128, 0.6);
            box-shadow: 0 0 6px rgba(128, 0, 128, 0.4);
        }

        @keyframes particle-float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* === GAME CONTAINER === */
        .game-container {
            background: rgba(12, 12, 35, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 500px;
            z-index: 10;
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(
                135deg,
                rgba(0, 212, 255, 0.2) 0%,
                transparent 30%,
                transparent 70%,
                rgba(255, 107, 107, 0.2) 100%
            );
            border-radius: 26px;
            z-index: -1;
            animation: border-glow 6s infinite ease-in-out;
        }

        .game-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 212, 255, 0.5),
                rgba(255, 107, 107, 0.5),
                transparent
            );
        }

        @keyframes border-glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Shine sweep across container */
        .game-container .sweep {
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.03),
                transparent
            );
            transform: skewX(-15deg);
            animation: sweep 8s infinite;
            pointer-events: none;
        }

        @keyframes sweep {
            0% { left: -60%; }
            100% { left: 120%; }
        }

        h1 {
            font-size: 2.8em;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d4ff, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: none;
            position: relative;
        }

        h1::after {
            content: '';
            display: block;
            width: 60%;
            height: 2px;
            margin: 8px auto 0;
            background: linear-gradient(90deg, transparent, #00d4ff, #ff6b6b, transparent);
            border-radius: 2px;
            filter: blur(1px);
        }

        .subtitle {
            font-size: 1.1em;
            margin-bottom: 25px;
            color: #667;
            text-align: center;
        }

        /* === SCOREBOARD === */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 18px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .score {
            text-align: center;
        }

        .score-label {
            font-size: 0.85em;
            color: #667;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .score-value.player { color: #00d4ff; }
        .score-value.computer { color: #ff6b6b; }
        .score-value.draws { color: #ffd700; }

        /* === BOARD === */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 25px 0;
            perspective: 800px;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.03) 0%,
                transparent 100%
            );
            border-radius: 16px 16px 0 0;
            pointer-events: none;
        }

        .cell:hover:not(.taken) {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 
                0 8px 25px rgba(0, 212, 255, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
        }

        .cell.taken {
            cursor: default;
        }

        .cell.x {
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.3);
            animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cell.o {
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.6), 0 0 40px rgba(255, 107, 107, 0.3);
            animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cell.winning {
            animation: win-pulse 1.2s infinite;
            border-color: rgba(0, 212, 255, 0.4);
            background: rgba(0, 212, 255, 0.08);
        }

        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes win-pulse {
            0%, 100% { 
                box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
                transform: scale(1.03);
            }
        }

        /* === STATUS === */
        .status {
            padding: 14px 24px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.3em;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .status.your-turn {
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
            color: #00d4ff;
        }

        .status.computer-turn {
            border-color: rgba(255, 107, 107, 0.4);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
        }

        .status.win {
            border-color: rgba(0, 212, 255, 0.5);
            background: rgba(0, 212, 255, 0.08);
            animation: win-glow 1.5s infinite ease-in-out;
            color: #00d4ff;
            font-weight: bold;
        }

        .status.draw {
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        @keyframes win-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.15); }
            50% { box-shadow: 0 0 35px rgba(0, 212, 255, 0.3); }
        }

        /* === BUTTONS === */
        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 130px;
            padding: 12px 24px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.15),
                transparent
            );
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button.primary {
            background: linear-gradient(135deg, rgba(0, 180, 220, 0.3), rgba(0, 80, 160, 0.4));
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.15);
        }

        button.primary:hover {
            background: linear-gradient(135deg, rgba(0, 180, 220, 0.4), rgba(0, 80, 160, 0.5));
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
        }

        button.secondary {
            background: linear-gradient(135deg, rgba(220, 80, 80, 0.3), rgba(160, 40, 40, 0.4));
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.15);
        }

        button.secondary:hover {
            background: linear-gradient(135deg, rgba(220, 80, 80, 0.4), rgba(160, 40, 40, 0.5));
            box-shadow: 0 6px 25px rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
        }

        /* === RESPONSIVE === */
        @media (max-width: 480px) {
            body { padding: 10px; }
            h1 { font-size: 2rem; }
            .game-container { padding: 20px 15px; border-radius: 18px; }
            .board { gap: 8px; margin: 15px 0; }
            .cell { border-radius: 12px; }
            .scoreboard { padding: 12px 5px; margin: 10px 0; }
            .score-value { font-size: 1.5em; }
            .status { font-size: 1.1em; padding: 12px 16px; }
            button { padding: 10px 16px; font-size: 0.9em; }
            .btn-container { gap: 8px; margin-top: 15px; }
        }
    </style>
</head>
<body>
    <!-- Spotlights -->
    <div class="spotlight-container">
        <div class="spotlight cyan"></div>
        <div class="spotlight magenta"></div>
        <div class="spotlight purple"></div>
        <div class="spotlight small-cyan"></div>
        <div class="spotlight small-magenta"></div>
    </div>

    <!-- Frosted Glass Background Panels -->
    <div class="frosted-bg">
        <div class="frosted-panel panel-1"></div>
        <div class="frosted-panel panel-2"></div>
        <div class="frosted-panel panel-3"></div>
        <div class="frosted-panel panel-4"></div>
        <div class="frosted-panel panel-5"></div>
    </div>

    <!-- Grid overlay -->
    <div class="grid-overlay"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Game UI -->
    <div class="game-container">
        <div class="sweep"></div>
        <h1>Tic-Tac-Toe</h1>
        <div class="subtitle">You are X &bull; Computer is O (Unbeatable AI)</div>

        <div class="scoreboard">
            <div class="score">
                <div class="score-label">You (X)</div>
                <div class="score-value player" id="player-score">0</div>
            </div>
            <div class="score">
                <div class="score-label">Draws</div>
                <div class="score-value draws" id="draw-score">0</div>
            </div>
            <div class="score">
                <div class="score-label">Computer (O)</div>
                <div class="score-value computer" id="computer-score">0</div>
            </div>
        </div>

        <div class="board" id="board"></div>

        <div class="status" id="status">Your turn (X)</div>

        <div class="btn-container">
            <button class="primary" onclick="resetGame()">
                <i class="fas fa-plus-circle"></i> New Game
            </button>
            <button class="secondary" onclick="resetScores()">
                <i class="fas fa-sync-alt"></i> Reset Scores
            </button>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const playerScoreEl = document.getElementById('player-score');
        const computerScoreEl = document.getElementById('computer-score');
        const drawScoreEl = document.getElementById('draw-score');
        const particlesContainer = document.getElementById('particles');

        let board = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;
        let currentPlayer = 'X';
        let playerScore = 0, computerScore = 0, drawScore = 0;
        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function createBoard() {
            boardElement.innerHTML = '';
            board.forEach((cell, index) => {
                const cellEl = document.createElement('div');
                cellEl.className = 'cell';
                cellEl.dataset.index = index;
                if (cell !== '') {
                    cellEl.classList.add('taken', cell.toLowerCase());
                    cellEl.textContent = cell;
                }
                cellEl.addEventListener('click', handleClick);
                boardElement.appendChild(cellEl);
            });
        }

        function handleClick(e) {
            const idx = parseInt(e.target.dataset.index);
            if (board[idx] || !gameActive || currentPlayer !== 'X') return;
            playMove(idx);
            if (gameActive) {
                currentPlayer = 'O';
                setStatus("Computer's turn (O)", 'computer-turn');
                setTimeout(computerMove, 600);
            }
        }

        function playMove(idx) {
            board[idx] = currentPlayer;
            const cell = document.querySelector(`.cell[data-index='${idx}']`);
            cell.classList.add('taken', currentPlayer.toLowerCase());
            cell.textContent = currentPlayer;
        }

        function computerMove() {
            if (!gameActive) return;
            let bestScore = -Infinity, move;
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    let score = minimax(board, 0, false);
                    board[i] = '';
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
            playMove(move);
            validateResult();
            if (gameActive) {
                currentPlayer = 'X';
                setStatus("Your turn (X)", 'your-turn');
            }
        }

        function minimax(bd, depth, isMax) {
            const result = checkWin(bd);
            if (result !== null) return result;
            if (isMax) {
                let best = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (bd[i] === '') { bd[i] = 'O'; best = Math.max(best, minimax(bd, depth + 1, false)); bd[i] = ''; }
                }
                return best;
            } else {
                let best = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (bd[i] === '') { bd[i] = 'X'; best = Math.min(best, minimax(bd, depth + 1, true)); bd[i] = ''; }
                }
                return best;
            }
        }

        function checkWin(bd) {
            for (const [a, b, c] of winConditions) {
                if (bd[a] && bd[a] === bd[b] && bd[a] === bd[c])
                    return bd[a] === 'O' ? 10 : -10;
            }
            if (!bd.includes('')) return 0;
            return null;
        }

        function validateResult() {
            for (const [a, b, c] of winConditions) {
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    [a, b, c].forEach(i => document.querySelector(`.cell[data-index='${i}']`).classList.add('winning'));
                    if (currentPlayer === 'X') {
                        setStatus('🎉 You win!', 'win');
                        playerScore++; playerScoreEl.textContent = playerScore;
                    } else {
                        setStatus('💻 Computer wins!', 'win');
                        computerScore++; computerScoreEl.textContent = computerScore;
                    }
                    gameActive = false;
                    return;
                }
            }
            if (!board.includes('')) {
                setStatus('🤝 It\'s a draw!', 'draw');
                drawScore++; drawScoreEl.textContent = drawScore;
                gameActive = false;
            }
        }

        function setStatus(text, cls) {
            statusElement.textContent = text;
            statusElement.className = 'status ' + cls;
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';
            setStatus('Your turn (X)', 'your-turn');
            createBoard();
        }

        function resetScores() {
            playerScore = computerScore = drawScore = 0;
            playerScoreEl.textContent = '0';
            computerScoreEl.textContent = '0';
            drawScoreEl.textContent = '0';
            resetGame();
        }

        // Create particles
        function createParticles() {
            const colors = ['cyan', 'magenta', 'purple'];
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                const color = colors[Math.floor(Math.random() * colors.length)];
                p.className = `particle ${color}`;
                const size = Math.random() * 4 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 20 + 15) + 's';
                p.style.animationDelay = (Math.random() * 20) + 's';
                particlesContainer.appendChild(p);
            }
        }

        // Init
        createBoard();
        createParticles();
    </script>
</body>
</html>

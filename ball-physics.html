<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Ball Bouncing in Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-size: 12px;
            z-index: 10;
            pointer-events: none;
        }
        
        #velocity {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #0ff;
            font-size: 14px;
            font-family: monospace;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">Click to reset ball position</div>
    <div id="velocity">Velocity: <span id="vel-display">0.00</span> m/s</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        camera.position.set(8, 6, 8);
        camera.lookAt(0, 0, 0);

        scene.background = new THREE.Color(0x050510);
        
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xffffff, 1, 100);
        pointLight1.position.set(5, 8, 5);
        pointLight1.castShadow = true;
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x4488ff, 0.5, 100);
        pointLight2.position.set(-5, 3, -5);
        scene.add(pointLight2);

        const containerSize = 6;
        const wallThickness = 0.1;
        const containerGeometry = new THREE.BoxGeometry(
            containerSize + wallThickness * 2,
            containerSize + wallThickness * 2,
            containerSize + wallThickness * 2
        );
        
        const wallMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x88ccff,
            transparent: true,
            opacity: 0.15,
            roughness: 0.1,
            metalness: 0.1,
            side: THREE.BackSide
        });
        
        const container = new THREE.Mesh(containerGeometry, wallMaterial);
        scene.add(container);

        const edgeGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(containerSize, containerSize, containerSize));
        const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x4488ff, opacity: 0.8, transparent: true });
        const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
        scene.add(edges);

        const ballRadius = 0.4;
        const ballGeometry = new THREE.SphereGeometry(ballRadius, 64, 64);
        
        const ballMaterial = new THREE.MeshStandardMaterial({
            color: 0xff6644,
            roughness: 0.2,
            metalness: 0.8,
            emissive: 0xff2200,
            emissiveIntensity: 0.1
        });
        
        const ball = new THREE.Mesh(ballGeometry, ballMaterial);
        ball.castShadow = true;
        ball.receiveShadow = true;
        scene.add(ball);

        const glowGeometry = new THREE.SphereGeometry(ballRadius * 1.3, 32, 32);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0xff4422,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        ball.add(glow);

        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        
        for (let i = 0; i < starCount * 3; i += 3) {
            const radius = 20 + Math.random() * 30;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            starPositions[i] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i + 2] = radius * Math.cos(phi);
        }
        
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.1,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        let velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 8,
            (Math.random() - 0.5) * 8,
            (Math.random() - 0.5) * 8
        );
        
        const position = new THREE.Vector3(0, 0, 0);
        
        const gravity = new THREE.Vector3(0, -0.5, 0);
        const restitution = 0.92;
        const friction = 0.995;
        const airResistance = 0.9995;

        let lastTime = performance.now();
        
        function updatePhysics(deltaTime) {
            const dt = Math.min(deltaTime, 0.05);
            
            velocity.addScaledVector(gravity, dt);
            velocity.multiplyScalar(airResistance);
            
            position.addScaledVector(velocity, dt);
            
            const halfSize = containerSize / 2 - ballRadius;
            
            if (position.x > halfSize) {
                position.x = halfSize;
                velocity.x = -velocity.x * restitution;
                applyFriction();
            } else if (position.x < -halfSize) {
                position.x = -halfSize;
                velocity.x = -velocity.x * restitution;
                applyFriction();
            }
            
            if (position.y > halfSize) {
                position.y = halfSize;
                velocity.y = -velocity.y * restitution;
                applyFriction();
            } else if (position.y < -halfSize) {
                position.y = -halfSize;
                velocity.y = -velocity.y * restitution;
                applyFriction();
            }
            
            if (position.z > halfSize) {
                position.z = halfSize;
                velocity.z = -velocity.z * restitution;
                applyFriction();
            } else if (position.z < -halfSize) {
                position.z = -halfSize;
                velocity.z = -velocity.z * restitution;
                applyFriction();
            }
            
            ball.position.copy(position);
            
            const speed = velocity.length();
            document.getElementById('vel-display').textContent = speed.toFixed(2);
            
            glowMaterial.opacity = 0.1 + Math.min(speed / 20, 0.3);
            ballMaterial.emissiveIntensity = 0.1 + Math.min(speed / 30, 0.4);
        }
        
        function applyFriction() {
            velocity.x *= friction;
            velocity.y *= friction;
            velocity.z *= friction;
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const currentTime = performance.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            updatePhysics(deltaTime);
            controls.update();
            
            stars.rotation.y += 0.0001;
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.domElement.addEventListener('click', (event) => {
            position.set(
                (Math.random() - 0.5) * 2,
                (Math.random() - 0.5) * 2,
                (Math.random() - 0.5) * 2
            );
            velocity.set(
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 10
            );
        });

        animate();
    </script>
</body>
</html>
